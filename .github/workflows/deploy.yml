name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch: # permite disparar manualmente na aba Actions também

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Node 24 vira padrão das actions em 16/06/2026; opt-in antecipado
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # versão vem do "packageManager" no package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build static site (pt/en/es)
        run: pnpm build # next build + export -> ./out

      - name: Deploy SFTP
        # O FTPS da HostGator é instável (SSL alert 50 no socket de dados);
        # SFTP (SSH) é criptografado e estável. Porta 2222, não 22, no shared.
        #
        # Aqui era usada a wlixcc/SFTP-Deploy-Action. Ela grava a chave com
        # `printf "%s"`, sem newline final, e o OpenSSH recusa o arquivo com
        # `error in libcrypto`. Hoje funciona só porque o secret foi colado pela
        # interface web, que preserva a quebra de linha final — mas basta
        # alguém regravar o secret com `gh secret set` lendo de stdin (que faz
        # TrimRight("\r\n")) para o deploy quebrar sem nenhuma mudança de código.
        # Escrevendo a chave com `printf '%s\n'`, o newline é garantido.
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE: ./public_html/casasboutiquepatacho.com.br
        run: |
          install -m 600 /dev/null key.pem
          printf '%s\n' "$SSH_KEY" > key.pem
          ssh-keygen -l -f key.pem > /dev/null || { echo "::error::Chave inválida."; exit 1; }

          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          find out -name '.DS_Store' -delete

          # O batch do sftp separa argumentos por espaço e não tem como escapar,
          # então um caminho com espaço subiria truncado e silenciosamente errado.
          if find out -name '*[[:space:]]*' | grep -q .; then
            echo "::error::Caminho com espaço dentro de out/ — o batch do sftp não suporta."
            find out -name '*[[:space:]]*'
            exit 1
          fi

          # A conta da HostGator não tem shell ("Shell access is not enabled"),
          # então não dá para usar rsync nem `ssh mkdir`: tudo sai pelo batch.
          # Um -mkdir por diretório (o `-` ignora "já existe", que acontece a
          # partir do segundo deploy) e um put por arquivo. O find pré-ordena,
          # então todo pai é criado antes do filho, e enxerga dotfiles — o
          # .htaccess entra aqui e dispensa o passo separado que existia antes.
          #
          # O `put` do sftp roda glob() no caminho local, e o App Router gera
          # diretórios literais como `[locale]`. Sem escapar, o sftp lê isso
          # como classe de caracteres, entra no modo "vários arquivos", trata o
          # destino como pasta e repete o basename — o envio morre com
          # `dest open ".../page-abc.js/page-abc.js": No such file or directory`.
          # O sed abaixo escapa [ ] * ? e a própria barra invertida.
          esc='s/[][*?\\]/\\&/g'
          {
            find out -mindepth 1 -type d -printf '%P\n' | sed "$esc" \
              | awk -v r="$REMOTE" '{print "-mkdir " r "/" $0}'
            find out -type f -printf '%P\n' | sed "$esc" \
              | awk -v r="$REMOTE" '{print "put out/" $0 " " r "/" $0}'
          } > batch.sftp
          echo "Arquivos a enviar: $(find out -type f | wc -l)"

          sftp -P 2222 -i key.pem -b batch.sftp "$SSH_USER@$SSH_HOST"

      - name: Remove a chave do runner
        if: always()
        run: rm -f key.pem
